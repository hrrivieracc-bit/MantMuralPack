:root{--navy:#13315C;--navy2:#1C3E6E;--navy-deep:#0E2547;--gold:#C7A23C;--gold-deep:#B68F2E;--gold-soft:#E2C880;
--maroon:#7E2A34;--paper:#F3F1EA;--card:#FFFFFF;--card-bd:#E5E1D6;--ink:#212934;--muted:#6E7682;--cream:#F3EFE5;--cream-dim:#C3CCDA;
--serif:'Source Serif 4',Georgia,serif;--sans:'Inter',system-ui,Arial,sans-serif;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--navy-deep);}
body{font-family:var(--sans);color:var(--cream);}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
#stage{position:relative;width:1280px;height:720px;overflow:hidden;transform-origin:center center;background:var(--navy);
background-image:radial-gradient(120% 90% at 88% -10%,#1a4079 0%,rgba(26,64,121,0) 55%),radial-gradient(150% 120% at -10% 120%,#102d57 0%,rgba(16,45,87,0) 50%);}
#stage::before{content:"";position:absolute;inset:16px;border:1px solid rgba(199,162,60,.30);pointer-events:none;z-index:8;}
.crestwrap{position:absolute;top:26px;left:44px;width:84px;height:84px;border-radius:50%;background:var(--cream);
border:3px solid var(--gold);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:9;}
.crestwrap img{width:64px;height:auto;}
.kick{position:absolute;top:46px;left:0;right:0;text-align:center;font-size:15px;letter-spacing:.30em;color:var(--gold-soft);
font-weight:700;text-transform:uppercase;font-family:var(--sans);}
.footer{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:var(--cream-dim);font-size:13px;
letter-spacing:.16em;text-transform:uppercase;font-family:var(--sans);}


.layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;} .balloon-bg{z-index:1;} .confetti-layer{z-index:2;}
.content{position:relative;z-index:5;width:100%;height:100%;}
@keyframes fall{0%{transform:translate3d(0,-70px,0) rotate(0)}100%{transform:translate3d(var(--dx,0),820px,0) rotate(var(--rz,540deg))}}
@keyframes rise{0%{transform:translateY(90px);opacity:0}8%{opacity:.85}90%{opacity:.85}100%{transform:translateY(-920px);opacity:0}}
@keyframes sway{0%,100%{transform:translateX(-11px)}50%{transform:translateX(11px)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2.5deg)}50%{transform:translateY(-16px) rotate(2.5deg)}}
.cf{position:absolute;top:0;} .br{position:absolute;bottom:-170px;} .br .sw{animation:sway 3.4s ease-in-out infinite;}
.hb{position:absolute;z-index:3;} .hb.l{left:150px;top:38px;animation:bob 4s ease-in-out infinite;} .hb.r{right:150px;top:28px;animation:bob 4.7s ease-in-out infinite .6s;}
.title{position:absolute;top:88px;left:0;right:0;text-align:center;font-family:var(--serif);font-size:66px;color:var(--gold);font-weight:700;text-shadow:0 3px 12px rgba(0,0,0,.4);}
.subtitle{position:absolute;top:180px;left:0;right:0;text-align:center;color:var(--cream);font-size:22px;font-style:italic;font-family:var(--serif);}
.weeklbl{position:absolute;top:222px;left:0;right:0;text-align:center;color:var(--cream-dim);font-size:15px;letter-spacing:.18em;text-transform:uppercase;}
.grid{position:absolute;top:288px;left:88px;right:88px;display:grid;grid-template-columns:1fr 1fr;gap:16px 26px;}
.card{background:rgba(255,255,255,.97);border-radius:15px;padding:14px 20px;display:flex;align-items:center;gap:18px;box-shadow:0 8px 20px rgba(0,0,0,.25);}
.badge{width:64px;height:64px;border-radius:13px;background:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;}
.badge .d{font-family:var(--serif);font-size:30px;font-weight:700;color:var(--cream);line-height:1;}
.badge .m{font-size:11px;letter-spacing:.12em;color:var(--gold-soft);margin-top:3px;font-weight:700;}
.who .name{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--ink);line-height:1.1;}
.who .dept{display:inline-block;margin-top:4px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-deep);font-weight:700;}
